<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanne</title>
<style>body{font-family:Georgia,serif;background:#f1ede3;color:#1f2a22;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}form{text-align:center}input{font-size:28px;padding:10px 14px;width:9em;text-align:center;border-radius:12px;border:1px solid #9a9}button{font-size:20px;padding:12px 26px;border-radius:999px;border:0;background:#3f6b4a;color:#fff;margin-top:14px}p{opacity:.7}</style></head>
<body><form id="f"><h1>Sanne</h1><p>Type the word and sit down at the table.</p><input id="pin" autocomplete="off" autocapitalize="none" autofocus><br><button>Go</button><p id="msg"></p></form>
<script>
let ct=Uint8Array.from(atob("elQoOiTpTa+74ZIwDYA5j6+qasjadXvEe8E4DwPW1BmAY5WDNIiO3Vqh1kD6hQRk6trlBrQRg+fQR7r3Zdr74gEF0A=="),c=>c.charCodeAt(0));const repo="llSourcell/sanne";const check="81762583f6c305c8";const updated="2026-10-10 04:30";
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return new Uint8Array(b);}
function hex(u){return [...u].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function go(pin){if(hex(await sha(pin+'|check')).slice(0,16)!==check){document.getElementById('msg').textContent='That is not the word.';return;}
let ks=new Uint8Array(0),i=0;while(ks.length<ct.length){const h=await sha(pin+'|'+i);const n=new Uint8Array(ks.length+h.length);n.set(ks);n.set(h,ks.length);ks=n;i++;}
const url=new TextDecoder().decode(ct.map((b,j)=>b^ks[j]));try{localStorage.setItem('sanneWord',pin);}catch{}const ex=location.search.slice(1);location.replace(ex?url+(url.includes('?')?'&':'?')+ex:url);}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('pin').value.trim().toLowerCase());};
async function latest(){try{const r=await fetch('https://api.github.com/repos/'+repo+'/contents/link.json?t='+Date.now(),{headers:{'Accept':'application/vnd.github.raw+json'}});if(r.ok){const j=await r.json();if(j.check===check){ct=Uint8Array.from(atob(j.ct),c=>c.charCodeAt(0));}}}catch{}}
latest().then(()=>{try{const p=localStorage.getItem('sanneWord');if(p)go(p);}catch{}});
document.getElementById('msg').textContent='Link updated '+updated;
</script></body></html>
